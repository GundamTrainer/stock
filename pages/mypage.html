<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 정보</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body data-require-auth="true">

  <header id="nav"></header>

  <main>
    <h1>내 정보</h1>

    <section class="card">
      <p>이메일: <strong id="myEmail"></strong></p>
      <p>내가 쓴 글: <strong id="myCount">-</strong>개</p>
    </section>

    <section class="rank-panel">
      <div class="rank-badge" id="rankBadge">BRONZE</div>
      <div class="rank-copy"><span class="kicker">TRADING CAREER</span><h2 id="rankTitle">브론즈 투자자</h2><p id="rankDescription">첫 번째 투자 기록을 쌓아보세요.</p><div class="rank-progress"><span id="rankProgressBar"></span></div><small id="rankNext">다음 등급까지 ₩1,000,000</small></div>
      <div class="rank-stats"><div><span>누적 매수</span><strong id="totalBought">₩0</strong></div><div><span>누적 매도</span><strong id="totalSold">₩0</strong></div><div><span>수익</span><strong id="totalProfit">₩0</strong></div></div>
    </section>

    <h2>내가 쓴 글</h2>
    <ul id="myList"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/common.js"></script>
  <script src="../static/js/mypage.js"></script>

</body>
</html>
